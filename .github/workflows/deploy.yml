name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 187.127.130.99 >> ~/.ssh/known_hosts

      - name: Package & upload
        run: |
          git archive HEAD --format=tar.gz -o /tmp/hk.tar.gz
          scp /tmp/hk.tar.gz root@187.127.130.99:/tmp/
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/id_ed25519"

      - name: Upload backend env
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          printf '%s' "$BACKEND_ENV" > /tmp/hk_backend_env
          scp -i ~/.ssh/id_ed25519 /tmp/hk_backend_env root@187.127.130.99:/tmp/hk_backend_env

      - name: Extract, rebuild & restart
        run: |
          ssh -i ~/.ssh/id_ed25519 root@187.127.130.99 '
            set -e
            mkdir -p /opt/hisabkitab
            tar -xzf /tmp/hk.tar.gz -C /opt/hisabkitab
            mv /tmp/hk_backend_env /opt/hisabkitab/Backend/.env.production
            rm -f /tmp/hk.tar.gz
            cd /opt/hisabkitab
            docker compose build
            docker compose up -d --force-recreate
          '

      - name: Health check
        run: |
          sleep 20
          curl -sf https://hisabkitab.basiq360.com/api/health && echo " — OK" || (echo "Health check failed" && exit 1)

name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf 'Host 187.127.130.99\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' >> ~/.ssh/config

      - name: Package & upload
        run: |
          git archive HEAD --format=tar.gz -o /tmp/hk.tar.gz
          scp /tmp/hk.tar.gz root@187.127.130.99:/tmp/

      - name: Extract, rebuild & restart
        run: |
          ssh root@187.127.130.99 '
            set -e
            mkdir -p /opt/hisabkitab
            tar -xzf /tmp/hk.tar.gz -C /opt/hisabkitab
            rm -f /tmp/hk.tar.gz
            cd /opt/hisabkitab
            docker compose build
            docker compose up -d --force-recreate
          '

      - name: Health check
        run: |
          sleep 20
          curl -sf https://hisabkitab.basiq360.com/api/health && echo " — OK" || (echo "Health check failed" && exit 1)
